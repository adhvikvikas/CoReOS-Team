[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coreos"
version = "0.1.0"
description = "Conflict-Aware, Self-Healing Multi-Agent AI Operating System Resource Manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alan Daniel", email = "research@coreos.ai" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
